name: Translate README

on:
  push:
    branches:
      - main

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Evita erro de conflito no push

      - name: Translate README to English
        uses: dephraiim/translate-readme@main
        with:
          LANG: en
